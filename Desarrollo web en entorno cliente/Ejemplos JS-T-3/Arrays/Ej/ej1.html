<body>
   <script>
let cantidad = prompt("Ingresa los elementos");
 let elementos = [];
 
 for (let i = 0; i < cantidad; i++) {
    let valores= prompt(`elemento ${i + 1}: `);
    elementos.push(+valores);
 }
 console.log("Elementos en consola" , elementos);

 for (let i = 0; i < elementos.length; i++) {
    console.log(elementos[i]);
    
 }
 </script>
</body>
