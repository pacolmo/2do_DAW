<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!--=ARRAY=
        Rellena un array de 50 valores de forma aleatoria, mostrándolos por pantalla.
         Por cosas de la vida, nos interesa ver esos ordenados de  forma ascendiente y también descendiente.-->

    <script>
        let array = [];
          for (let i = 1; i <= 50; i++) {
            let aleatorio = Math.floor(Math.random() * 101);
            array.push(aleatorio);
          }

            array.sort((a,b) => a-b);
            console.log("Ascendente: ",array);
            
            array.reverse((a,b) => b-a);
            console.log("Descendente: ",array);
            
    </script>
</body>
</html>
