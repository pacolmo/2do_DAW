<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!--Escribe una función que reciba dos palabras (string) y retorne verdadero o falso (boolean) según sean o no anagramas.
        Un Anagrama consiste en formar una palabra reordenando TODAS las letras de otra palabra inicial.
        NO hace falta comprobar que ambas palabras existan.
        Dos palabras exactamente iguales no son anagrama.
        Los datos deben ser recogido a través de window.prompt().
        El resultado debe ser mostrado a través de window.alert().-->
        
    <script>
        function esAnagrama(palabra1,palabra2) {
            
            let p1 = palabra1.toLowerCase();
            let p2 = palabra2.toLowerCase();
           
            if (p1 === p2) {
                return false;
            }
            if (p1.length !== p2.length ) {
                return false;
            }

            let p1Ordenada = p1.split('').sort().join('');
            let p2Ordenada = p2.split('').sort().join('');

            return p1Ordenada === p2Ordenada;
        }

        let primPalabra = window.prompt("introduce la primera palabra");
        let segPalabra = window.prompt("introduce la segunda palabra");

        if (primPalabra && segPalabra) {
            
            let resultado = esAnagrama(primPalabra,segPalabra);
            if (resultado) {
                window.alert(`"${primPalabra}" y "${segPalabra}" "SI son anagramas"`);
            }else{
                window.alert(`"${primPalabra}" y "${segPalabra}" "NO son anagramas"`);
            }
        }else{
            window.alert("Error, debes introducir dos palabras");
        }


    </script>
</body>
</html>
