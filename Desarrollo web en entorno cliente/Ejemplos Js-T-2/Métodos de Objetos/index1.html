    <script>
        /*EJERCICIO: Crea un objeto llamado tvSamsung con las propiedades:
        nombre (“TV Samsung 42”), categoria (“Televisores”), unidades (4), precio (345.95) 
        y con un método llamado importe que devuelve el valor total de las unidades (nº de unidades * precio)*/

        let tvSamsung = {
            categoria:"televisores",
            unidades : 4,
            precio: 345.95,
             importe : function unidades() {
                return this.unidades * this.precio;
            }
        };
        console.log(tvSamsung.importe());

    </script>
