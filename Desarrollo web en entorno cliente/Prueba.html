<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        "use strict";
       //1
        let saludar = nombre => `Hola me llamo ${nombre}`;
         console.log(saludar("Paco"));

       //2
        let doblar  = numero => (numero * 2);
         console.log(doblar(5));

        //3
        setTimeout(function() {
            console.log("Tiempo cumplido");
        }, 2000);

        //4
        setTimeout(() => {
            console.log("Tiempo cumplido")
        }, 2000);

        //5
        let numeros = [2,4,6,8];
         numeros.forEach(numero =>{
            console.log("El cuadrado de  " +  numero + " es: " + (numero + numero * 2) );
         });

         //6
         function sumar(num1,num2) {
            return num1 + num2;
         }
        console.log(sumar(5,5));

        let sumando = (a,b) => (a + b);
          console.log(sumando(15,5));
        /*Ejercicio: “Cuenta regresiva con mensajes”
            Objetivo:
            Usar funciones flecha (=>) junto con setTimeout y setInterval para crear una pequeña cuenta regresiva,
            y mostrar mensajes en distintos momentos*/
             function cuentaRegresiva() {
            let temporizador = 10;
            let intervalo = setInterval(() => {
             
                console.log(temporizador);
                temporizador--;
                if (temporizador < 0) {
                    clearInterval(intervalo);
                    console.log("Din din...Tiempo!!!");
                }
                
            }, 1000);
        }
        cuentaRegresiva();
         
        </script>
</body>
</html>
