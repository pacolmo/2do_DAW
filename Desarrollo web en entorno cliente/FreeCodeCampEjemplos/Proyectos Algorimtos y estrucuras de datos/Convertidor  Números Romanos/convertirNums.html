    <script>
        function convertirARomano(num) {
         let numeros = [["M", 1000],
          ["CM", 900],["D", 500],["CD", 400],["C", 100],["XC", 90],["L", 50],["XL", 40], 
           ["X", 10],["IX", 9],["V", 5],["IV", 4],["I", 1]];

         let resultado = "";
       
          for (let /*elemento*/ [clave,valor] of numeros) {
            /*esta seria otra manera de hacerlo
            let clave = elemento[0];  
            let valor = elemento[1];*/
            while (num >= valor) {
                  resultado += clave;
                  num -= valor;
         }
    }
             return resultado;
}

    console.log(`El 36 en romano es: ${convertirARomano(36)}`);// XXXVI

    </script>
