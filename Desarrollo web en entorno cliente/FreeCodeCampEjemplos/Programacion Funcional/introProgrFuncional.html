    <script>
        /*La programación funcional es un estilo de programación donde las soluciones son funciones simples y aisladas,
         sin efectos secundarios fuera del alcance de la función.
         Funciones aisladas: no hay dependencia del estado del programa, que incluye variables globales que están sujetas a cambios.
        Funciones puras: la misma entrada siempre da la misma salida
        Funciones con efectos secundarios limitados: cualquier cambio o mutación en el estado del programa 
        fuera de la función se controla cuidadosamente.*/

        /*Recuerde que en programación funcional, cambiar o alterar algo se denomina mutación ,
         y el resultado se denomina efecto secundario*/




         
    </script>
