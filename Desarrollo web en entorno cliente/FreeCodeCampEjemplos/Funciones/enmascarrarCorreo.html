<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
      function maskEmail(email){
        let partes = email.split('@');
        let nombreUsuario = partes[0];
        let dominio = partes[1];
        let primeraLetra = nombreUsuario[0];
        let ultimaLetra = nombreUsuario[nombreUsuario.length -1];
        //Usamos -2 porque el correo completo tiene 9 letras, y como queremos dejar 2 letras visibles, lo hacemos así
        let asterisco = '*'.repeat(nombreUsuario.length -2);
        let nombreEnmascarado = primeraLetra + asterisco + ultimaLetra;
        return nombreEnmascarado + '@' + dominio;

}   
    let email = "fraolmseg@gmail.com";
    console.log(maskEmail(email));
    </script>
</body>
</html>
