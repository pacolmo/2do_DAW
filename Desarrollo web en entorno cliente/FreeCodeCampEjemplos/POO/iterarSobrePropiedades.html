<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

<body>
    <script>

        /*Añade todas las propiedades propias de beaglea la matriz ownProps.
        Añade todas las prototypepropiedades de Doga la matriz prototypeProps.*/
        function Dog(name) {
  this.name = name;
}

Dog.prototype.numLegs = 4;

let beagle = new Dog("Snoopy");

let ownProps = [];
let prototypeProps = [];

// Only change code below this line

for(let property in beagle){

 if(beagle.hasOwnProperty(property)){
   ownProps.push(property);
}else{
  prototypeProps.push(property);
}
}
console.log(ownProps);
console.log(prototypeProps);
    </script>
</body>
